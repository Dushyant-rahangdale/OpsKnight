name: Docs links (v1.3)

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/v1.3/**'
      - 'scripts/check-docs-links.cjs'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - 'docs/v1.3/**'
      - 'scripts/check-docs-links.cjs'
      - '.github/workflows/docs-links.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative markdown links in docs/v1.3
        run: node scripts/check-docs-links.cjs
